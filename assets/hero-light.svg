<svg xmlns="http://www.w3.org/2000/svg" width="850" height="196" viewBox="0 0 850 196" role="img" aria-label="blycr — 后端工程 · 图形实验 · 实用工具">
  <defs>
    <linearGradient id="accent-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0969da"/>
      <stop offset="55%" stop-color="#218bff"/>
      <stop offset="100%" stop-color="#1a7f37"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="32%" r="48%">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0.10"/>
      <stop offset="55%" stop-color="#1a7f37" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#d0d7de" opacity="0.7"/>
    </pattern>
    <clipPath id="card-clip">
      <rect x="0.5" y="0.5" width="849" height="195" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card-clip)">
    <rect width="850" height="196" fill="#ffffff"/>
    <rect width="850" height="196" fill="url(#dot-grid)"/>
    <rect width="850" height="196" fill="url(#glow)"/>
    <rect x="0" y="0" width="850" height="3" fill="url(#accent-bar)"/>

    <!-- Subtle orbital / engineering motif on the right -->
    <g transform="translate(716, 102)" fill="none">
      <circle r="78" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 6"/>
      <circle r="54" stroke="#0969da" stroke-width="1" stroke-opacity="0.32"/>
      <ellipse rx="70" ry="26" transform="rotate(-18)" stroke="#0969da" stroke-width="1.2" stroke-opacity="0.45"/>
      <ellipse rx="70" ry="26" transform="rotate(28)" stroke="#1a7f37" stroke-width="1" stroke-opacity="0.32"/>
      <circle r="10" fill="#f6f8fa" stroke="#0969da" stroke-width="1.5"/>
      <circle r="3.5" fill="#0969da"/>
      <circle cx="-54" cy="18" r="3" fill="#1a7f37"/>
      <circle cx="48" cy="-24" r="2.5" fill="#218bff"/>
      <circle cx="20" cy="50" r="2.5" fill="#8250df"/>
    </g>

    <!-- Status eyebrow -->
    <g transform="translate(40, 42)">
      <rect x="0" y="0" width="190" height="24" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
      <circle cx="15" cy="12" r="3.5" fill="#1a7f37"/>
      <text x="27" y="16" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="500">~/blycr · OPEN &amp; FREE</text>
    </g>

    <!-- Main lockup -->
    <text x="40" y="114" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.8">blycr</text>

    <!-- Tagline -->
    <text x="40" y="143" fill="#24292f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="500">后端工程 · 图形实验 · 实用工具</text>

    <!-- Subtitle -->
    <text x="40" y="168" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">Go / Rust Systems  ·  WebGL &amp; Simulation  ·  Cross-platform CLI</text>
  </g>

  <rect x="0.5" y="0.5" width="849" height="195" rx="14" fill="none" stroke="#d0d7de" stroke-width="1"/>
</svg>
